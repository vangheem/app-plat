apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: app-plat
data:
  01-init.sql: |
    CREATE DATABASE kratos;
    CREATE DATABASE hydra;
    \c appplat
    CREATE SCHEMA IF NOT EXISTS pgbouncer;
    CREATE OR REPLACE FUNCTION pgbouncer.get_auth(p_usename text)
    RETURNS TABLE(username text, password text)
    LANGUAGE sql SECURITY DEFINER SET search_path = pg_catalog AS $$
      SELECT usename::text, passwd::text FROM pg_shadow WHERE usename = p_usename;
    $$;
    REVOKE ALL ON FUNCTION pgbouncer.get_auth(text) FROM PUBLIC;
    DO $$
    BEGIN
      IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'pgbouncer_auth') THEN
        CREATE ROLE pgbouncer_auth LOGIN PASSWORD 'pgbouncer_auth';
      END IF;
    END $$;
    GRANT USAGE ON SCHEMA pgbouncer TO pgbouncer_auth;
    GRANT EXECUTE ON FUNCTION pgbouncer.get_auth(text) TO pgbouncer_auth;
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: app-plat
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: app-plat
  labels:
    app: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: appplat
            - name: POSTGRES_PASSWORD
              value: appplat
            - name: POSTGRES_DB
              value: appplat
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "appplat"]
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-data
        - name: init
          configMap:
            name: postgres-init
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: app-plat
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
