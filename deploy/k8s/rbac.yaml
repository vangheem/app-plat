apiVersion: v1
kind: ServiceAccount
metadata:
  name: control-plane
  namespace: app-plat
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: admin
  namespace: app-plat
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: user
  namespace: app-plat
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: llm-gateway
  namespace: app-plat
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: blob-gateway
  namespace: app-plat
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kratos
  namespace: app-plat
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hydra
  namespace: app-plat
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: control-plane
  namespace: app-plat
rules:
  - apiGroups: [""]
    resources: ["services", "secrets", "serviceaccounts", "configmaps", "pods", "pods/log"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["networking.istio.io"]
    resources: ["virtualservices", "gateways", "destinationrules"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["security.istio.io"]
    resources: ["authorizationpolicies", "peerauthentications"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: control-plane
  namespace: app-plat
subjects:
  - kind: ServiceAccount
    name: control-plane
    namespace: app-plat
roleRef:
  kind: Role
  name: control-plane
  apiGroup: rbac.authorization.k8s.io
