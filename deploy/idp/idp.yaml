apiVersion: v1
kind: ConfigMap
metadata:
  name: kratos
  namespace: app-plat
data:
  kratos.yaml: |
    version: v0.13.0
    dsn: postgres://appplat:appplat@postgres:5432/kratos?sslmode=disable
    serve:
      public:
        base_url: http://kratos:4433/
        port: 4433
        cors:
          enabled: true
          allowed_origins:
            - "*"
      admin:
        base_url: http://kratos:4434/
        port: 4434
    selfservice:
      default_browser_return_url: http://app.127.0.0.1.nip.io:30080/
      allowed_return_urls:
        - http://app.127.0.0.1.nip.io:30080
        - http://admin.127.0.0.1.nip.io:30080
      methods:
        password:
          enabled: true
        link:
          enabled: false
        code:
          enabled: true
      flows:
        error:
          ui_url: http://app.127.0.0.1.nip.io:30080/login
        settings:
          ui_url: http://app.127.0.0.1.nip.io:30080/settings
          privileged_session_max_age: 15m
        recovery:
          enabled: false
          ui_url: http://app.127.0.0.1.nip.io:30080/login
        verification:
          enabled: false
          ui_url: http://app.127.0.0.1.nip.io:30080/login
        logout:
          after:
            default_browser_return_url: http://app.127.0.0.1.nip.io:30080/login
        login:
          ui_url: http://app.127.0.0.1.nip.io:30080/login
          lifespan: 30m
        registration:
          ui_url: http://app.127.0.0.1.nip.io:30080/register
          lifespan: 30m
          after:
            password:
              hooks:
                - hook: session
    log:
      level: info
      format: text
    secrets:
      cookie:
        - 0123456789abcdef0123456789abcdef
      cipher:
        - fedcba9876543210fedcba9876543210
    ciphers:
      algorithm: xchacha20-poly1305
    hashers:
      algorithm: bcrypt
      bcrypt:
        cost: 8
    identity:
      default_schema_id: default
      schemas:
        - id: default
          url: file:///etc/config/identity.schema.json
    courier:
      smtp:
        connection_uri: smtps://noop:noop@127.0.0.1:1234/?skip_ssl_verify=true
  identity.schema.json: |
    {
      "$id": "https://schemas.app-plat.local/identity.schema.json",
      "$schema": "http://json-schema.org/draft-07/schema#",
      "title": "App Plat User",
      "type": "object",
      "properties": {
        "traits": {
          "type": "object",
          "properties": {
            "email": {
              "type": "string",
              "format": "email",
              "ory.sh/kratos": {
                "credentials": {"password": {"identifier": true}}
              }
            },
            "name": {"type": "string"}
          },
          "required": ["email"],
          "additionalProperties": false
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kratos
  namespace: app-plat
  labels:
    app: kratos
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kratos
  template:
    metadata:
      labels:
        app: kratos
    spec:
      serviceAccountName: kratos
      initContainers:
        - name: migrate
          image: oryd/kratos:v26.2.0
          args: ["migrate", "sql", "-c", "/etc/config/kratos.yaml", "-e", "--yes"]
          volumeMounts:
            - name: config
              mountPath: /etc/config
      containers:
        - name: kratos
          image: oryd/kratos:v26.2.0
          args: ["serve", "-c", "/etc/config/kratos.yaml", "--watch-courier=false"]
          ports:
            - name: public
              containerPort: 4433
            - name: admin
              containerPort: 4434
          volumeMounts:
            - name: config
              mountPath: /etc/config
          readinessProbe:
            httpGet:
              path: /health/ready
              port: public
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
      volumes:
        - name: config
          configMap:
            name: kratos
---
apiVersion: v1
kind: Service
metadata:
  name: kratos
  namespace: app-plat
spec:
  selector:
    app: kratos
  ports:
    - name: public
      port: 4433
      targetPort: 4433
    - name: admin
      port: 4434
      targetPort: 4434
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hydra
  namespace: app-plat
data:
  hydra.yaml: |
    serve:
      public:
        port: 4444
        cors:
          enabled: true
      admin:
        port: 4445
      cookies:
        same_site_mode: Lax
    urls:
      self:
        issuer: http://oauth.127.0.0.1.nip.io:30080
      consent: http://app.127.0.0.1.nip.io:30080/oauth2/consent
      login: http://app.127.0.0.1.nip.io:30080/oauth2/login
      logout: http://app.127.0.0.1.nip.io:30080/oauth2/logout
    secrets:
      system:
        - app-plat-hydra-system-secret-32
    oidc:
      subject_identifiers:
        supported_types:
          - public
        pairwise:
          salt: app-plat-hydra-pairwise-salt
    ttl:
      access_token: 1h
      refresh_token: 720h
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hydra
  namespace: app-plat
  labels:
    app: hydra
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hydra
  template:
    metadata:
      labels:
        app: hydra
    spec:
      serviceAccountName: hydra
      initContainers:
        - name: migrate
          image: oryd/hydra:v26.2.0
          args: ["migrate", "sql", "-e", "--yes", "--config", "/etc/config/hydra.yaml"]
          env:
            - name: DSN
              value: postgres://appplat:appplat@postgres:5432/hydra?sslmode=disable
          volumeMounts:
            - name: config
              mountPath: /etc/config
      containers:
        - name: hydra
          image: oryd/hydra:v26.2.0
          args: ["serve", "all", "--dev", "--config", "/etc/config/hydra.yaml"]
          env:
            - name: DSN
              value: postgres://appplat:appplat@postgres:5432/hydra?sslmode=disable
          ports:
            - name: public
              containerPort: 4444
            - name: admin
              containerPort: 4445
          volumeMounts:
            - name: config
              mountPath: /etc/config
          readinessProbe:
            httpGet:
              path: /health/ready
              port: public
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
      volumes:
        - name: config
          configMap:
            name: hydra
---
apiVersion: v1
kind: Service
metadata:
  name: hydra
  namespace: app-plat
spec:
  selector:
    app: hydra
  ports:
    - name: public
      port: 4444
      targetPort: 4444
    - name: admin
      port: 4445
      targetPort: 4445
